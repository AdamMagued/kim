<!-- Synthesized Gemini response DOM: plain-text completion. The response
     root is <model-response> (the site's first response_selector), with the
     real app's Angular nesting down to div.markdown inside <message-content>.
     Because model-response has a single non-<pre> element child, the markdown
     serializer flattens to innerText — the contract for prose answers.
     __COMPLETION_HASH__ is replaced with the live per-turn sentinel by the test. -->
<model-response class="ng-star-inserted">
<div class="response-container ng-star-inserted">
<div class="response-container-content">
<div class="presented-response-container">
<div class="response-content">
<message-content class="model-response-text ng-star-inserted">
<div class="markdown markdown-main-panel" dir="ltr">
<p data-sourcepos="1:1-1:78">TASK_COMPLETE: Pong game opened in the browser and the paddle movement was verified.</p>
<p data-sourcepos="3:1-3:30"><code>__COMPLETION_HASH__</code></p>
</div>
</message-content>
</div>
</div>
</div>
</div>
</model-response>
