[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m uvicorn relay_server.main:app --host 0.0.0.0 --port $PORT --workers 1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# /status requires an X-API-Key. Railway's prober doesn't send one, so we
# expose an unauthenticated /health route purely for liveness.
healthcheckPath = "/health"
healthcheckTimeout = 10

[[services]]
name = "kim-relay"
