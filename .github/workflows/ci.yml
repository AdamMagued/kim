name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'kim-improvement', 'production-roadmap']
  pull_request:
    branches: [main, kim-improvement]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── File-size gate (Q6): no new/growing source files over 800 lines ───────
  file-size-gate:
    name: File-size gate (Q6)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (#59)
        with:
          fetch-depth: 0

      - name: Check new/changed files stay under 800 lines
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branches / force-pushes / workflow_dispatch: fall back to the
          # default branch, then to the parent commit.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD~1)
          fi
          echo "Comparing against base: $BASE"
          python3 scripts/check_file_size_gate.py "$BASE"

  # ── Frontend: TypeScript + Vite build + Vitest ─────────────────────────────
  frontend:
    name: Frontend (TS + Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (#59)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (#59)
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Events schema drift check
        run: |
          npm run gen:events
          git diff --exit-code src/types/events.gen.ts src-tauri/src/events.gen.rs ../orchestrator/events_gen.py || (echo "ERROR: generated IPC bindings are out of sync with events.schema.json. Run 'npm run gen:events' and commit all generated outputs." && exit 1)

      - name: Vitest unit tests
        run: npm run test

      - name: Vite build
        run: npm run build

  # ── Rust: cargo check + clippy + test ──────────────────────────────────────
  rust:
    name: Rust (check + clippy + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (#59)

      - name: Install Linux system deps (Tauri requires WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (#59)
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2 (#59)
        with:
          workspaces: . -> target

      - name: cargo check
        run: cargo check -p desktop

      - name: cargo clippy
        run: cargo clippy -p desktop -- -D warnings

      - name: cargo test
        run: cargo test -p desktop

  # ── Rust CLI: fmt + check + test (no Tauri/WebKit deps) ──────────────────
  rust-cli:
    name: Rust CLI (fmt + check + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (#59)

      - name: Install Rust stable (+ rustfmt)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (#59)
        with:
          components: rustfmt

      - name: Rust cache (cli)
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2 (#59)
        with:
          workspaces: . -> target

      - name: cargo fmt check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: cargo check
        run: cargo check -p kim-cli

      - name: cargo test
        run: cargo test -p kim-cli -- --test-threads=1

  # ── Python: lint + pytest ──────────────────────────────────────────────────
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (#59)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (#59)
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps from requirements.txt (validates real dependency set, #54)
        run: |
          pip install --upgrade pip
          # Install from the canonical requirements file so CI always validates the
          # same dep set that ships.  Exclude heavy platform deps that need system
          # libs (playwright, pyautogui, pyobjc, pywin32) — they are guarded by
          # sys_platform markers and are not needed for unit tests.
          pip install \
            -r requirements.txt \
            flake8 \
            pyright \
            --ignore-requires-python \
            --no-deps 2>/dev/null || true
          # Re-install with deps to get transitive graph correct for the core subset
          pip install \
            mcp \
            anthropic \
            openai \
            python-dotenv \
            PyYAML \
            httpx \
            aiofiles \
            aiohttp \
            json5 \
            json-repair \
            flake8 \
            pyright \
            pytest \
            pytest-asyncio \
            pytest-cov

      - name: pyright (basic type check — orchestrator/providers + mcp_server)
        run: |
          pyright --outputjson | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          errs = [e for e in d.get('generalDiagnostics', []) if e['severity'] == 'error']
          if errs:
              for e in errs:
                  print(e['file'] + ':' + str(e['range']['start']['line']+1) + ': ' + e['message'])
              sys.exit(1)
          print('pyright: 0 errors')
          "

      - name: flake8 lint (orchestrator)
        run: |
          # agent.py contains long single-line system-prompt literals that are
          # deliberately on one source line so they read as one paragraph to
          # the LLM. Breaking them would change the prompt content; instead
          # exempt that single file from line-length checks. Every other file
          # (incl. run_claw_bridge.py and providers/*) stays strict at 120.
          flake8 orchestrator/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --per-file-ignores=orchestrator/agent.py:E501 \
            --exclude=__pycache__,.venv,venv

      - name: Python import check
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from orchestrator import memory
          from orchestrator import session_store
          from orchestrator import context_loader
          print('All orchestrator modules import cleanly.')
          "

      - name: pytest (unit + integration tests, coverage gate)
        run: |
          # T7 coverage gate: measured baseline is ~62% across the three
          # Python runtimes (2026-07). The floor is a ratchet — raise it as
          # coverage grows; never lower it to make a PR pass.
          python -m pytest tests/ -v \
            --ignore=tests/kim_test_suite.py \
            --ignore=tests/claw_test_suite.py \
            --ignore=tests/test_gemini_user_project_mode.py \
            --cov=orchestrator \
            --cov=mcp_server \
            --cov=codex_engine \
            --cov-report=term \
            --cov-fail-under=55
