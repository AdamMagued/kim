name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: TypeScript + Vite build + Vitest ─────────────────────────────
  frontend:
    name: Frontend (TS + Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest unit tests
        run: npm run test

      - name: Vite build
        run: npm run build

  # ── Rust: cargo check + clippy + test ──────────────────────────────────────
  rust:
    name: Rust (check + clippy + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri requires WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop/src-tauri -> target

      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check

      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test

  # ── Rust CLI: fmt + check + test (no Tauri/WebKit deps) ──────────────────
  rust-cli:
    name: Rust CLI (fmt + check + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (+ rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache (cli)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./cli -> target

      - name: cargo fmt check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: cargo check
        run: cargo check --manifest-path cli/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path cli/Cargo.toml -- --test-threads=1

  # ── Python: lint + pytest ──────────────────────────────────────────────────
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install core deps (no heavy playwright/pyautogui)
        run: |
          pip install --upgrade pip
          pip install \
            mcp \
            anthropic \
            openai \
            python-dotenv \
            PyYAML \
            httpx \
            aiofiles \
            flake8 \
            pytest \
            pytest-asyncio

      - name: flake8 lint (orchestrator)
        run: |
          # agent.py contains long single-line system-prompt literals that are
          # deliberately on one source line so they read as one paragraph to
          # the LLM. Breaking them would change the prompt content; instead
          # exempt that single file from line-length checks. Every other file
          # (incl. run_claw_bridge.py and providers/*) stays strict at 120.
          flake8 orchestrator/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --per-file-ignores=orchestrator/agent.py:E501 \
            --exclude=__pycache__,.venv,venv

      - name: Python import check
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from orchestrator import memory
          from orchestrator import session_store
          from orchestrator import context_loader
          print('All orchestrator modules import cleanly.')
          "

      - name: pytest (unit tests)
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/kim_test_suite.py \
            --ignore=tests/claw_test_suite.py \
            --ignore=tests/test_gemini_user_project_mode.py
