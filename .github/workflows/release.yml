name: Release

# Trigger modes:
#   1. Push a version tag (v1.2.3)  →  create a real GitHub Release
#   2. Manual "Run workflow" button →  build only, no release published
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build binaries but do not publish a release'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-and-release:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
            cli-target-dir: target/aarch64-apple-darwin/release
            cli-asset-suffix: macos-aarch64
            cli-bin: kim

          - label: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin
            cli-target-dir: target/x86_64-apple-darwin/release
            cli-asset-suffix: macos-x86_64
            cli-bin: kim

          - label: Linux (x64)
            platform: ubuntu-22.04
            args: ''
            rust-target: ''
            cli-target-dir: target/release
            cli-asset-suffix: linux-x86_64
            cli-bin: kim

          - label: Windows (x64)
            platform: windows-latest
            args: ''
            rust-target: ''
            cli-target-dir: target/release
            cli-asset-suffix: windows-x86_64
            cli-bin: kim.exe

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write      # create releases and upload release assets
      id-token: write      # cosign OIDC keyless signing for CLI binaries

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (#59)

      # ── Node.js ─────────────────────────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (#59)
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (#59)
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2 (#59)
        with:
          workspaces: . -> target

      # ── Linux system libs (WebKit2GTK + friends) ─────────────────────────
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Frontend deps ────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci --prefer-offline --no-audit

      # ── macOS certificate import ─────────────────────────────────────────
      # Imports the Apple Developer ID certificate into a short-lived keychain
      # so tauri-action can codesign and notarize the .app / .dmg bundles.
      # Required secrets: APPLE_CERTIFICATE (base64-encoded P12),
      #                   APPLE_CERTIFICATE_PASSWORD.
      # Notarization secrets: APPLE_ID, APPLE_PASSWORD (app-specific),
      #                       APPLE_TEAM_ID, APPLE_SIGNING_IDENTITY.
      # See: https://tauri.app/distribute/sign/macos/
      # Step is a no-op (prints a notice) when APPLE_CERTIFICATE is not set.
      - name: Import Apple certificate (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "::notice::APPLE_CERTIFICATE secret not set — macOS codesigning skipped."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # ── Upload raw binaries on workflow_dispatch (dry run) ────────────────
      - name: Build (dry run — upload artifact)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0 (#59)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS codesign / notarize — no-op when secrets are absent
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      # ── Full release on version tag ────────────────────────────────────────
      - name: Build and publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0 (#59)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS codesign / notarize — no-op when secrets are absent
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Kim ${{ github.ref_name }}'
          releaseBody: |
            ## Kim ${{ github.ref_name }}

            ### Download the right file for your OS

            | Platform | Desktop app | KimCLI (terminal) |
            |---|---|---|
            | macOS (Apple Silicon M1/M2/M3) | `Kim_*_aarch64.dmg` | `kim-cli-*-macos-aarch64` |
            | macOS (Intel) | `Kim_*_x64.dmg` | `kim-cli-*-macos-x86_64` |
            | Windows 10/11 | `Kim_*_x64-setup.exe` | `kim-cli-*-windows-x86_64.exe` |
            | Linux (Debian/Ubuntu) | `kim_*_amd64.deb` | `kim-cli-*-linux-x86_64` |
            | Linux (other) | `kim_*_amd64.AppImage` | `kim-cli-*-linux-x86_64` |

            > **Signing:** Desktop builds are codesigned and notarized when
            > `APPLE_CERTIFICATE`, `APPLE_SIGNING_IDENTITY`, `APPLE_ID`,
            > `APPLE_PASSWORD`, and `APPLE_TEAM_ID` repository secrets are set.
            > CLI binaries on tagged releases include Sigstore transparency-log
            > signatures (`.sig` / `.pem` files) verifiable with
            > `cosign verify-blob --signature <file>.sig --certificate <file>.pem <binary>`.
            > If codesigning secrets are not configured, macOS Gatekeeper will
            > prompt on first launch: right-click → Open.

            ### What is Kim?
            Kim is a local AI agent that controls your computer —
            browser, terminal, files, apps — using any LLM provider
            (Claude, GPT-4o, Gemini) or free browser-based mode (no API key).

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ── Keychain cleanup ─────────────────────────────────────────────────
      # Always runs on macOS to delete the ephemeral keychain regardless of
      # whether the build succeeded or failed.
      - name: Delete temporary Apple keychain (macOS)
        if: always() && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [[ -n "${{ env.KEYCHAIN_PATH }}" ]]; then
            security delete-keychain "${{ env.KEYCHAIN_PATH }}" || true
          fi

      # ── KimCLI binary ─────────────────────────────────────────────────────

      - name: Compute KimCLI asset name
        id: cli-asset
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="sha-$(git rev-parse --short HEAD)"
          fi
          # Preserve .exe suffix from matrix cli-bin (kim or kim.exe)
          BIN="${{ matrix.cli-bin }}"
          EXT="${BIN#kim}"          # '' on Unix, '.exe' on Windows
          FILENAME="kim-cli-${VERSION}-${{ matrix.cli-asset-suffix }}${EXT}"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build KimCLI
        shell: bash
        run: |
          EXTRA=""
          if [[ -n "${{ matrix.rust-target }}" ]]; then
            EXTRA="--target ${{ matrix.rust-target }}"
          fi
          cargo build -p kim-cli --release $EXTRA

      - name: Stage KimCLI binary
        id: cli-stage
        shell: bash
        run: |
          mkdir -p cli-dist
          SRC="${{ matrix.cli-target-dir }}/${{ matrix.cli-bin }}"
          DEST="cli-dist/${{ steps.cli-asset.outputs.filename }}"
          cp "${SRC}" "${DEST}"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"

      # ── Sigstore / cosign signing for CLI binary ─────────────────────────
      # Signs the CLI binary using keyless OIDC signing via Sigstore, which
      # requires no long-lived secret — the runner's OIDC token is sufficient.
      # Produces <binary>.sig and <binary>.pem published alongside the binary.
      # Verify with: cosign verify-blob --signature <f>.sig --certificate <f>.pem <binary>
      - name: Install cosign
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0 (#59)

      - name: Sign KimCLI binary (cosign keyless)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cosign sign-blob --yes \
            --output-signature "${{ steps.cli-stage.outputs.path }}.sig" \
            --output-certificate "${{ steps.cli-stage.outputs.path }}.pem" \
            "${{ steps.cli-stage.outputs.path }}"

      - name: Upload KimCLI artifact (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (#59)
        with:
          name: ${{ steps.cli-asset.outputs.filename }}
          path: ${{ steps.cli-stage.outputs.path }}
          retention-days: 7

      - name: Upload KimCLI to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 (#59)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          # draft: true keeps this consistent with the draft created by tauri-action.
          # softprops uses getReleaseByTag which excludes draft releases from its
          # results; without draft:true it would create a *published* release for the
          # same tag, producing two separate releases (one draft with the Tauri desktop
          # assets, one published with only the CLI binary).
          draft: true
          make_latest: false
          files: |
            ${{ steps.cli-stage.outputs.path }}
            ${{ steps.cli-stage.outputs.path }}.sig
            ${{ steps.cli-stage.outputs.path }}.pem
