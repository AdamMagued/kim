name: Rust coverage

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-coverage:
    name: Desktop + CLI coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (#59)
        with:
          persist-credentials: false

      - name: Install Linux system deps (Tauri requires WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable with coverage tools
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (#59)
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2 (#59)
        with:
          workspaces: . -> target
          cache-targets: false
          shared-key: rust-coverage

      - name: Install pinned cargo-llvm-cov
        run: |
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          test "$(cargo llvm-cov --version)" = "cargo-llvm-cov 0.8.7"

      - name: Measure workspace coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --no-report -- --test-threads=1

      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          cargo llvm-cov report --text --output-path coverage/summary.txt
          cargo llvm-cov report --json --output-path coverage/coverage.json
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --html

          test -s coverage/summary.txt
          test -s coverage/coverage.json
          test -s coverage/lcov.info
          test -s target/llvm-cov/html/index.html

          grep -q 'desktop/src-tauri/' coverage/lcov.info
          grep -q 'cli/src/' coverage/lcov.info
          cat coverage/summary.txt

      - name: Upload Rust coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (#59)
        with:
          name: rust-workspace-coverage
          path: |
            coverage/summary.txt
            coverage/coverage.json
            coverage/lcov.info
            target/llvm-cov/html/
          if-no-files-found: error
          retention-days: 14
