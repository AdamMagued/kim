[package]
name = "desktop"
version = "0.10.0"
description = "Kim Desktop — AI Agent Platform"
authors = ["Kim"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true, features = ["process", "io-util", "rt", "sync", "time", "macros"] }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
base64 = { workspace = true }
keyring = "2"
rand = "0.8"
sha2 = "0.10"
url = "2"

[target.'cfg(unix)'.dependencies]
# Direct kill(2)/ESRCH syscalls for process liveness checks and signalling —
# replaces spawning a `kill` process every 100ms in cancel pollers (M-PROC-5).
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
