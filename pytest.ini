[pytest]
# Vendored sub-projects (pythonExperimentTool/claw-code, archive/…) carry their
# own test trees with imports that only resolve from their own rootdir; a bare
# `pytest` from the repo root must not try to collect them.
testpaths = tests

# Custom marks (use @pytest.mark.slow for tests that need real network/browser/API)
markers =
    slow: marks tests as slow (require real network, browser, or API keys) — deselect with -m "not slow"
