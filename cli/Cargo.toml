[package]
name = "kim-cli"
version = "0.3.0"
edition = "2021"
description = "Kim terminal CLI — install once, works anywhere"
license = "MIT"
publish = false

[[bin]]
name = "kim"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
dirs = { workspace = true }
futures-util = "0.3"
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
rustyline = "15"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
