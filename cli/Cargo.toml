[package]
name = "kim-cli"
version = "0.3.0"
edition = "2021"
description = "Kim terminal CLI — install once, works anywhere"
license = "MIT"
publish = false

[[bin]]
name = "kim"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
dirs = "5"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
