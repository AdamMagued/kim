[package]
name = "kim-cli"
version = "0.3.0"
edition = "2021"
description = "Kim terminal CLI — install once, works anywhere"
license = "MIT"
publish = false

[lib]
name = "kim_cli"
path = "src/lib.rs"

[[bin]]
name = "kim"
path = "src/main.rs"

# `kim tui` launcher standalone entry point — spawns the kimcli/codex binary
# (see src/commands/tui.rs). Shares all logic with `kim tui` via the kim_cli
# library crate rather than duplicating it in a second binary.
[[bin]]
name = "kimcli"
path = "src/bin/kimcli.rs"

[dependencies]
base64 = { workspace = true }
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
dirs = { workspace = true }
# #7: cross-process advisory lock for save_session_messages_in — already a
# transitive dependency via rustyline, promoted to direct so we can use it.
fd-lock = "4"
futures-util = "0.3"
# `kim tui`'s graceful proxy shutdown (SIGTERM, grace period, then SIGKILL) —
# already a transitive dependency (e.g. via rustyline), promoted to direct the
# same way fd-lock was.
libc = "0.2"
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
rustyline = "15"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
